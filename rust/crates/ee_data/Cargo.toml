[package]
name = "ee_data"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The data layer (docs/RUST_PLAN.md R2): the db tables' text compiler, the content dump, the rules documents, the
# open formats. An rlib of the staticlib ee_rust: its extern "C" items (ffi.rs) reach the exe through ee_rust.
[lib]
path = "src/lib.rs"
# and the staticlib of the C++ gate tool (tools/eedata/cppgate.py; it was the crate ee_data_cabi)
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "ee_data_gate"
path = "src/bin/ee_data_gate.rs"

# The game's startup load of a text db, timed, with its allocations counted (PORT_LEARNINGS "R2 performance")
[[bin]]
name = "ee_data_startup"
path = "src/bin/ee_data_startup.rs"
