[package]
name = "ee_gfx"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The game's Graphics Thread and its camera (docs/RUST_PLAN.md R4.4) behind their C++ classes: the decisions and the
# arithmetic as plain values in and out, the C++ keeping every GE/GX call, object and lock. The camera's math first
# (EECameraControl), over ee_ge's math.
[lib]
crate-type = ["rlib"]

[dependencies]
ee_ge = { path = "../ee_ge" }
ee_random = { path = "../ee_random" }
