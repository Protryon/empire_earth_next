[package]
name = "ee_rust"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The one static library the exe links: every crate of the workspace comes in through this one.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ee_panic = { path = "../ee_panic" }
ee_data = { path = "../ee_data" }
ee_plat_core = { path = "../ee_plat_core" }
ee_plat_sys = { path = "../ee_plat_sys" }
ee_mixer = { path = "../ee_mixer" }
ee_net_tcp = { path = "../ee_net_tcp" }
ee_random = { path = "../ee_random" }
ee_codec = { path = "../ee_codec" }
ee_gx = { path = "../ee_gx" }
