[package]
name = "ee_rust"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The one static library the exe links: every crate of the workspace comes in through this one.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ee_base = { path = "../ee_base" }
ee_data = { path = "../ee_data" }
ee_audio = { path = "../ee_audio" }
ee_net = { path = "../ee_net" }
ee_sim = { path = "../ee_sim" }
ee_render = { path = "../ee_render" }
ee_ui = { path = "../ee_ui" }
ee_won = { path = "../ee_won" }
ee_screens = { path = "../ee_screens" }
ee_app = { path = "../ee_app" }
