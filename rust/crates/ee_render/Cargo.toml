# ee_render: ee_dx7, ee_ge, ee_gfx, ee_gx, ee_openformats (docs/progress/crate-restructure.md)
[package]
name = "ee_render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "eemodel_gate"
path = "src/bin/eemodel_gate.rs"

[dependencies]
ee_base = { path = "../ee_base" }
ee_data = { path = "../ee_data" }
ee_sim = { path = "../ee_sim" }
# the models' glTF files (openformats/document.rs): the GLB container and the document's serde structures; none of
# its importer (files, images), the game resolves buffers and textures itself
gltf = { version = "1.4.1", default-features = false, features = ["extras", "extensions", "names"] }
# a model's EE_model extension and material extras (openformats/json.rs); `float_roundtrip`: every number is the
# nearest double of its text, in the glTF document too (the vertices' and transforms' floats)
serde_json = { version = "1.0.143", features = ["float_roundtrip"] }
# the Graphics Engine's JPG and JPG2 surface files are written with it (libjpeg left the tree, 2026-11-17)
jpeg-encoder = "0.7.1"
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
wgpu = { git = "https://github.com/gfx-rs/wgpu", tag = "v24.0.3", default-features = false, features = ["wgsl", "dx12", "metal", "counters"] }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
