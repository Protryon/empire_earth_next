[package]
name = "ee_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The Low-Level Engine's UI toolkit (docs/RUST_PLAN.md R6, `src/Low-Level Engine/User Interface`): its algorithms
# (layout, hit testing, sliders, text wrapping) behind the C++ UI* classes, which stay as forwarders
# (`User Interface/UITrampolines.cpp`). Game text is Windows-1252 bytes (decision D6 is open), never `String`.
[lib]
crate-type = ["rlib"]

