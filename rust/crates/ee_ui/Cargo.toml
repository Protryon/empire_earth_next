[package]
name = "ee_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The Low-Level Engine's UI toolkit (docs/RUST_PLAN.md R6, `src/Low-Level Engine/User Interface`): its algorithms
# (layout, hit testing, sliders, text wrapping) behind the C++ UI* classes, which stay as forwarders
# (`User Interface/UITrampolines.cpp`). Game text is UTF-8 bytes (decision D6), never `String`.
[lib]
crate-type = ["rlib"]

[features]
# leaves out the imports of the C++ toolkit (as a test binary does): for the tests of a crate that calls the toolkit's
# objects (ee_screens toolkit.rs over direct.rs)
no_cpp = []

[dependencies]
ee_plat_core = { path = "../ee_plat_core" }
# the blinking button's fade: UMSin, the Graphics Engine's table cosine
ee_ge = { path = "../ee_ge" }
