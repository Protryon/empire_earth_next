[package]
name = "ee_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The app and world lane (docs/progress/r6-app-and-world.md): the game's options and settings, the camera and the
# ambient sounds as Rust records and bodies behind their C++ classes (src/Empire Earth/Empire Earth). The C++ side
# is reached only through the host callbacks the C++ passes in; no FFI imports.
[lib]
crate-type = ["rlib"]

[dependencies]
# config.yaml (PlatConfig*): the settings' rows
ee_plat_core = { path = "../ee_plat_core" }
