# ee_sim: ee_ai, ee_app, ee_astar, ee_combat, ee_formations, ee_netmsg, ee_rmap, ee_scenario, ee_tech, ee_units (docs/progress/crate-restructure.md)
[package]
name = "ee_sim"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
ee_base = { path = "../ee_base" }
ee_data = { path = "../ee_data" }
libc = "0.2"
mlua-sys = { version = "0.13", default-features = false, features = ["lua54", "external"] }

[features]
# TEST ONLY: `world::layout::with_test_layout` for the dependents' tests (ee_game's, through its dev-dependency)
test_layout = []

[build-dependencies]
cc = "1"
