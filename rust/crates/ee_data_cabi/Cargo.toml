[package]
name = "ee_data_cabi"
version.workspace = true
edition.workspace = true
publish.workspace = true

# A staticlib of ee_data alone: the C++ gate tool (tools/eedata/cppgate) links it instead of the whole ee_rust
# (no wgpu). The game itself links ee_rust.
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
ee_data = { path = "../ee_data" }
