[package]
name = "ee_won"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

# the platform layer's sockets, threads and clock, called as Rust (ee_rust links them as the C ABI too)
[dependencies]
ee_base = { path = "../ee_base" }
# the platform fonts (the lobby's fonts and window captions, platfont.rs and platwm.rs)
# the lobby's PNG pictures (imgdec.rs), as the game reads its own
ee_openformats = { path = "../ee_openformats" }
