[package]
name = "ee_screens"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The game's screens on the UI toolkit (docs/RUST_PLAN.md "R6 game screens"): the decisions of the forms' events
# (src/Empire Earth/UI Events, User Interface Thread), behind the C++ event classes, which keep the controls, the
# calls into the toolkit and every simulation call: plain values in and out. The forms that moved whole (menus.rs)
# call the C++ host back (menus_ffi.rs, absent from a test binary).
[lib]
crate-type = ["rlib"]

[dependencies]
# a name's characters as UWideString reads them (the UTF-8 steps of PlatMbsNInc)
ee_plat_core = { path = "../ee_plat_core" }
