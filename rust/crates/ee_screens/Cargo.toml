[package]
name = "ee_screens"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The game's screens on the UI toolkit (docs/RUST_PLAN.md "R6 game screens"): the decisions of the forms' events
# (src/Empire Earth/UI Events, User Interface Thread), behind the C++ event classes, which keep the controls, the
# calls into the toolkit and every simulation call: plain values in and out. The forms that moved whole (menus.rs)
# call the C++ host back (menus_ffi.rs, absent from a test binary).
[lib]
crate-type = ["rlib"]

[dependencies]
# a name's characters as UWideString reads them (the UTF-8 steps of PlatMbsNInc)
ee_plat_core = { path = "../ee_plat_core" }
# GERectangle and its And (the framed background's clips: frame.rs)
ee_ge = { path = "../ee_ge" }
# the effect types read and write an effect's numbers in place (editor_effects.rs: EeScenarioEffectFields)
ee_scenario = { path = "../ee_scenario" }
# the box selection's geometry (select_units.rs)
ee_gfx = { path = "../ee_gfx" }
# the scenario editor's terrain paint draws its ambient units from URandom (editor_actions.rs)
ee_random = { path = "../ee_random" }
# the toolkit's Rust objects, reached directly (toolkit.rs over ee_ui direct.rs)
ee_ui = { path = "../ee_ui" }

[dev-dependencies]
# the toolkit without its C++ imports, for the test binary
ee_ui = { path = "../ee_ui", features = ["no_cpp"] }
