# ee_audio: ee_mixer, ee_sound (docs/progress/crate-restructure.md)
[package]
name = "ee_audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
ee_base = { path = "../ee_base" }
rustysynth = "1.3"
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "mp3", "flac"] }
