[package]
name = "ee_ai"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The computer player's leaves (docs/RUST_PLAN.md R5a.8): the next engine's save blocks ("EENS", "EENU"), the AI
# manifest (Data/ai/ais.json) and the seat choice, the next engine's name tables. No game state: the C++ hands plain
# values over and keeps its objects.
[lib]
crate-type = ["rlib"]

[dependencies]
ee_plat_core = { path = "../ee_plat_core" }
libc = "0.2"
# the C API of the vendored Lua the C++ build compiles (src/ThirdParty/lua/ee_lua.c): `external` links no Lua of its
# own (never `vendored`: lua-src brings its own luaconf and a random hash seed)
mlua-sys = { version = "0.13", default-features = false, features = ["lua54", "external"] }

[build-dependencies]
# ee_lua.c for this crate's tests only (build.rs)
cc = "1"
