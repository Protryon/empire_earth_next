# ee_game: ee_app, ee_rust, ee_screens (docs/progress/crate-restructure.md)
[package]
name = "ee_game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ee_audio = { path = "../ee_audio" }
ee_base = { path = "../ee_base" }
ee_data = { path = "../ee_data" }
ee_net = { path = "../ee_net" }
ee_net_tcp = { path = "../ee_net_tcp" }
ee_render = { path = "../ee_render" }
ee_sim = { path = "../ee_sim" }
ee_ui = { path = "../ee_ui" }
ee_won_gui = { path = "../ee_won_gui" }
ee_won_lobby = { path = "../ee_won_lobby" }
ee_won_net = { path = "../ee_won_net" }

# the start screen's splash window (gamecpp start_screen.rs)
[target.'cfg(windows)'.dependencies]
windows-sys-059 = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"], package = "windows-sys" }

[dev-dependencies]
ee_ui = { path = "../ee_ui", features = ["no_cpp"] }
ee_sim = { path = "../ee_sim", features = ["test_layout"] }
