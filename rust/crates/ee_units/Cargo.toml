[package]
name = "ee_units"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# the db row the unit classes' records are filled from (unit_class_fields.rs)
ee_data = { path = "../ee_data" }
# the explore goal's bad tiles (U2DSparseArrayPointContainer's set)
ee_astar = { path = "../ee_astar" }
# GE3DPoint's squared distance (the cast calamity's range)
ee_ge = { path = "../ee_ge" }

[dev-dependencies]
# the copied MSVC sort's golden inputs (msvc_sort.rs, as ee_sound's)
ee_random = { path = "../ee_random" }
