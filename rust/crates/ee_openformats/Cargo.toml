[package]
name = "ee_openformats"
version.workspace = true
edition.workspace = true
publish.workspace = true

# glTF -> .cem and PNG -> .sst (docs/RUST_PLAN.md R2.4). Hand ports of cgltf's and stb_image's readers, so that the
# accept/refuse decisions and the bytes stay those of the C++ loader (tools/eemodel cppgate); no glTF or PNG crates.
[lib]
crate-type = ["rlib"]

# The gate program `eemodel.py cppgate` runs over exported cases.
[[bin]]
name = "eemodel_gate"
path = "src/bin/eemodel_gate.rs"

[dependencies]
