[package]
name = "ee_openformats"
version.workspace = true
edition.workspace = true
publish.workspace = true

# glTF and PNG -> the models and textures the game stores (docs/RUST_PLAN.md R2.4, D9). Hand ports of cgltf's and
# stb_image's readers, so that the accept/refuse decisions and the results stay those of the C++ loader
# (tools/eemodel cppgate); no glTF or PNG crates. ee_ge: the model's types (model_store.rs).
[lib]
crate-type = ["rlib"]

# The gate program `eemodel.py cppgate` runs over exported cases.
[[bin]]
name = "eemodel_gate"
path = "src/bin/eemodel_gate.rs"

[dependencies]
ee_ge = { path = "../ee_ge" }
