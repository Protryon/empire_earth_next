# ee_base: ee_codec, ee_error, ee_fs, ee_input, ee_panic, ee_plat_core, ee_plat_sdl, ee_plat_sys, ee_plat_ui, ee_random, ee_time, ee_ts, ee_ustring, ee_util (docs/progress/crate-restructure.md)
[package]
name = "ee_base"
version.workspace = true
edition.workspace = true
