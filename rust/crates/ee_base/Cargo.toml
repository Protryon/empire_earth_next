windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
