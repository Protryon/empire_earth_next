language = "C++"
cpp_compat = true
include_guard = "EE_RUST_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true

[parse]
parse_deps = true
include = ["ee_panic", "ee_rust", "ee_codec", "ee_net_tcp", "ee_mixer"]
extra_bindings = ["ee_codec", "ee_net_tcp", "ee_mixer"]

[export]
item_types = ["functions", "constants", "structs", "enums", "typedefs", "opaque"]
