language = "C++"
cpp_compat = true
include_guard = "EE_RUST_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true

[parse]
parse_deps = true
include = ["ee_panic", "ee_rust", "ee_codec", "ee_net_tcp", "ee_mixer", "ee_data", "ee_rmap", "ee_fs", "ee_dx7"]
extra_bindings = ["ee_codec", "ee_net_tcp", "ee_mixer", "ee_rmap", "ee_fs", "ee_dx7"]

[export]
item_types = ["functions", "constants", "structs", "enums", "typedefs", "opaque"]
# seam records only C++ fills (referenced by no exported function)
include = ["ModelInfo", "MaterialInfo", "LightData"]

# ee_rmap's generic names, kept unique in the shared header
[export.rename]
"Point" = "EeRmapPoint"
"Settings" = "EeRmapSettings"
"Ring" = "EeRmapRing"
"Rect" = "EeRmapRect"
"Circle" = "EeRmapCircle"
"Object" = "EeRmapObject"
"Feature" = "EeRmapFeature"
"ResourceKind" = "EeRmapResourceKind"
"ResourceSlot" = "EeRmapResourceSlot"
"SpacingRule" = "EeRmapSpacingRule"
# ee_fs
"Archive" = "EeFsArchive"
# ee_dx7
"StandardVertexArray" = "EeDx7StandardVertexArray"
"StdColorVertexArray" = "EeDx7StdColorVertexArray"
"PolygonArray" = "EeDx7PolygonArray"
"ScreenState" = "EeDx7ScreenState"
"TextureStageCache" = "EeDx7TextureStageCache"
"Viewport" = "EeDx7Viewport"
"StageView" = "EeDx7StageView"
"TextInfo" = "EeDx7TextInfo"
"TextRect" = "EeDx7TextRect"
"Handle" = "EeDx7Handle"
"LongResult" = "EeDx7LongResult"
"Transform" = "EeDx7Transform"
"ModelInfo" = "EeDx7ModelInfo"
"MaterialInfo" = "EeDx7MaterialInfo"
"ViewportInfo" = "EeDx7ViewportInfo"
"Plane" = "EeDx7Plane"
"RenderVertex" = "EeDx7RenderVertex"
"TerrainPolygon" = "EeDx7TerrainPolygon"
"TerrainMeshView" = "EeDx7TerrainMeshView"
"MaterialView" = "EeDx7MaterialView"
"MaterialMapEntry" = "EeDx7MaterialMapEntry"
"LightData" = "EeDx7LightData"
"WaterRipple" = "EeDx7WaterRipple"
