language = "C++"
cpp_compat = true
include_guard = "EE_RUST_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true

[parse]
parse_deps = true
include = ["ee_panic", "ee_rust", "ee_codec", "ee_net_tcp", "ee_mixer", "ee_data", "ee_rmap", "ee_fs", "ee_dx7", "ee_openformats", "ee_formations", "ee_sound", "ee_ge", "ee_ui"]
extra_bindings = ["ee_codec", "ee_net_tcp", "ee_mixer", "ee_rmap", "ee_fs", "ee_dx7", "ee_openformats", "ee_formations", "ee_sound", "ee_ge", "ee_ui"]

[export]
item_types = ["functions", "constants", "structs", "enums", "typedefs", "opaque"]
# seam records only C++ fills (referenced by no exported function)
include = ["ModelInfo", "MaterialInfo", "LightData", "NodeFields", "GeTmPoint"]

# ee_rmap's generic names, kept unique in the shared header
[export.rename]
"Point" = "EeRmapPoint"
"Settings" = "EeRmapSettings"
"Ring" = "EeRmapRing"
"Rect" = "EeRmapRect"
"Circle" = "EeRmapCircle"
"Object" = "EeRmapObject"
"Feature" = "EeRmapFeature"
"ResourceKind" = "EeRmapResourceKind"
"ResourceSlot" = "EeRmapResourceSlot"
"SpacingRule" = "EeRmapSpacingRule"
# ee_formations
"Vec3" = "EeFormationVec3"
"Rotation" = "EeFormationRotation"
# ee_fs
