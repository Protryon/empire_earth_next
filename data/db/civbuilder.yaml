# civbuilder: Empire Earth: The Art of Conquest rules (tools/eedata/rules.py; the game: EERules.cpp). What each civilization builder attribute raises.
# A key left out keeps the game's default (the value written here).
eedata: civbuilder
format: 3
# An upgrade is a category (dbcivilization) and a level; the level is an attribute here, the category's
# mLevels[level - 1] its value and bonus. applies: stats (C++ primitives) with a mode: share (the stat's own rule:
# a share of the class's base value, the original's), add (+ value) or multiply (x (1 + value)); gather_time takes
# a slot (0 .. 6); only_category / except_category limit an apply to unit classes of a category; power: a civ power.
attributes:
  - id: attack
    level: 1
    name: 29717
    applies:
      - stat: attack
  - id: hit_points
    level: 2
    name: 29718
    applies:
      - stat: hit_points
  - id: reload_time
    level: 3
