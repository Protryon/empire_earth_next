# aipersonalities: Empire Earth: The Art of Conquest rules (tools/eedata/rules.py; the game: EERules.cpp). The computer players' personalities: the tuning of their decisions outside dbcpbehavior.
# A key left out keeps the game's default (the value written here).
eedata: aipersonalities
format: 3
personalities:
  - id: balanced                # the tuning the benchmarks settled on (docs/AI_RESEARCH.md 8.10-8.27)
    epoch_pressure:              # the elapsed share of the epoch timer (dbcpbehavior rows 28/29)
      start: 0.3                   # a paid epoch advance is asked for from here ...
      full: 0.8                    # ... and its cost is wholly reserved from here
      stone_span: 30               # the Prehistoric instead: the game time over this many minutes (0: the timer)
      safe_bonus: 0.25             # from the Stone Age: this much more while no stronger enemy is near the town
    economy:
      surplus: 1000                # a resource with more in stock ...
      surplus_cut: 0.5             # ... gets this share of its gatherers
      low_stock: 150               # a resource with less in stock ...
      floor:                       # ... at least this share of the gatherers
        food: 0.1
        wood: 0.25
        stone: 0.05
        gold: 0.05
        iron: 0.05
      max_citizen_share: 0.7       # the citizen target: at most this share of the pop cap
      wood_slots: 15               # the gatherers wood takes (trees are not resource-center units)
      moves_per_cycle: 3           # busy gatherers moved to a short resource per 10 s
      demand_split: true           # gatherers by the tiered demand less the stock (false: the needs ledger)
      coast_fishing: true          # from the Stone Age: a dock and up to 8 fishing boats off any coast
      forage_patches: true         # about mining_limit a patch, settlements on patches, hunting, 32 boats
      claim_needed: true           # claim the next epoch's missing stone/gold/iron; no reserve when unreachable
      early_town_centers: 2        # before Bronze: settlements upgraded below this many town centres, no capitol (0: the timers)
      early_trainers: 2            # before Copper: at most this many barracks and archery ranges each (0: no cap)
      patch_expand: true           # before Copper: the claim range grows when no forage patch is left in it
    military:
      standing_army: 0.25          # the army kept per worker (up to the military share of the pop cap)
      army_floor: 0.1              # while it is short: up to this much more floor share on its unit's costs
      militia: true                # an attack group on the citizens: nearby soldiers and citizens fight when the odds allow, else the citizens run
      militia_towers: true         # ... the built towers near the attack count, and citizens run to a tower
      prehistoric_army: 4          # the Prehistoric army cap unless a stronger enemy is near (0: none)
      prehistoric_attacks: false   # attack groups against an enemy in the Prehistoric
      stone_attacks: false         # ... and in the Stone Age
      naval_flee: true             # units under warship fire they cannot answer leave
