name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the runner has Visual Studio 2022 (the MSVC STL, the UCRT and the Windows SDK); a current LLVM:
      - name: LLVM
        run: choco upgrade llvm -y --no-progress

      - name: Cache the DirectX 7 SDK headers
        uses: actions/cache@v4
        with:
          path: toolchain
          key: dx7sdk-${{ hashFiles('tools/fetch_dx7sdk.py') }}

      - name: Fetch the DirectX 7 SDK headers
        run: python -I tools/fetch_dx7sdk.py

      - name: Build every image
        run: python -I build.py -j 4
