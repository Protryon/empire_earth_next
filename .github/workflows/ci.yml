name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the runner has Visual Studio 2022 (the MSVC STL, the UCRT and the Windows SDK); a current LLVM:
      - name: LLVM
        run: choco upgrade llvm -y --no-progress

      - name: Cache wgpu-native
        uses: actions/cache@v4
        with:
          path: toolchain
          key: wgpu-${{ hashFiles('tools/fetch_wgpu.py') }}

      # the renderer's static wgpu-native x86_64 (sha256-pinned GitHub release; 7-Zip is on the runner)
      - name: Fetch wgpu-native
        run: python -I tools/fetch_wgpu.py

      # the window layer's SDL3 sources (built static by build.py) and the built-in fonts
      - name: Fetch SDL3 and the fonts
        run: python -I tools/fetch_posix.py sdl3 fonts

      - name: Build the x86_64 exe
        run: python -I build.py -j 4
